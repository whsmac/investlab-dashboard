name: Simulator unit tests

on:
  pull_request:
    paths:
      - 'src/simulator/**'
      - 'tests/**'
      - 'virtual-trade-simulator.html'
      - '.github/workflows/simulator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulator tests
        run: node --test tests/*.test.mjs
