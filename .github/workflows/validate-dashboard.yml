name: Validate dashboard scripts

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main, "feature/**"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
                  self.external = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.current = []
                      self.external = any(k.lower() == "src" for k, _ in attrs)

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      code = "".join(self.current).strip()
                      if code and not self.external:
                          self.scripts.append(code)
                      self.current = None
                      self.external = False

          parser = InlineScripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found")
          for i, code in enumerate(parser.scripts, 1):
              Path(f"/tmp/investlab-inline-{i}.js").write_text(code, encoding="utf-8")

          preview = InlineScripts()
          preview.feed(Path("ai-investment-cycle-preview.html").read_text(encoding="utf-8"))
          six_company = InlineScripts()
          six_company.feed(Path("six-company-price-preview.html").read_text(encoding="utf-8"))
          import_ui = InlineScripts()
          import_ui.feed(Path("shared-data-import.html").read_text(encoding="utf-8"))
          if not import_ui.scripts:
              raise SystemExit("No CSV import UI script found")
          for i, code in enumerate(import_ui.scripts, 1):
              Path(f"/tmp/investlab-import-ui-{i}.mjs").write_text(code, encoding="utf-8")
          shared_data = InlineScripts()
          shared_data.feed(Path("shared-data.html").read_text(encoding="utf-8"))
          if not preview.scripts:
              raise SystemExit("No preview module script found")
          if not six_company.scripts:
              raise SystemExit("No six-company preview module script found")
          if not shared_data.scripts:
              raise SystemExit("No shared-data module script found")
          for i, code in enumerate(preview.scripts, 1):
              Path(f"/tmp/investlab-preview-{i}.mjs").write_text(code, encoding="utf-8")
          for i, code in enumerate(six_company.scripts, 1):
              Path(f"/tmp/investlab-six-company-{i}.mjs").write_text(code, encoding="utf-8")
          for i, code in enumerate(shared_data.scripts, 1):
              Path(f"/tmp/investlab-shared-data-{i}.js").write_text(code, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} production inline blocks, {len(preview.scripts)} preview blocks, {len(shared_data.scripts)} shared-data blocks")
          PY
          for file in /tmp/investlab-inline-*.js /tmp/investlab-preview-*.mjs /tmp/investlab-six-company-*.mjs /tmp/investlab-shared-data-*.js /tmp/investlab-import-ui-*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Run isolated investment-cycle tests
        run: node --test tests/ai-investment-cycle.test.mjs tests/market-data-csv.test.mjs tests/market-data-bundle.test.mjs tests/market-cycle-analysis.test.mjs tests/ai-investment-cycle-preview.test.mjs tests/market-performance-ui.test.mjs tests/sec-companyfacts.test.mjs tests/quarterly-normalizer.test.mjs tests/sec-issuer-statement-map.test.mjs tests/six-company-price-csv.test.mjs tests/six-company-price-series.test.mjs tests/six-company-price-preview.test.mjs tests/six-company-financial-csv.test.mjs tests/six-company-financial-preview.test.mjs tests/shared-data-schema-foundation.test.mjs tests/shared-data-dashboard.test.mjs tests/shared-data-csv-import-validator.test.mjs tests/shared-data-importer.test.mjs tests/shared-data-import-ui.test.mjs tests/shared-data-import-rpc.test.mjs
      - name: Check required symbol-management elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="menuDashboard"', 'id="menuSymbols"', 'href="./shared-data.html"', 'id="symbolManagementView"',
              'id="symbolInput"', 'id="managedHoldingsBody"', 'id="watchlistBody"',
              'id="pastSymbolsBody"', 'function renderSymbolManagement'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required elements: " + ", ".join(missing))
          print("Required symbol-management elements are present")
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise the six-company preview in Chromium
        run: node tests/six-company-browser-smoke.mjs
      - name: Exercise the shared data view in Chromium
        run: node tests/shared-data-browser-smoke.mjs
      - name: Exercise the TEST CSV import screen in Chromium\n        run: node tests/shared-data-import-browser-smoke.mjs
      - name: Exercise authenticated import flow with mocked Supabase\n        run: node tests/shared-data-import-browser-flow.mjs
